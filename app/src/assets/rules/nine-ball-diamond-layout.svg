<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">9-ball diamond rack overhead layout</title>
  <desc id="desc">Overhead 9-ball table diagram showing a diamond rack with the 1-ball at the apex, the 9-ball in the center, and the cue ball behind the head string.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="ballLight" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#111827"/>
  <rect x="120" y="110" width="1360" height="780" rx="72" fill="#5a341f"/>
  <rect x="165" y="155" width="1270" height="690" rx="48" fill="#d9c9a7"/>
  <rect x="205" y="195" width="1190" height="610" rx="30" fill="#137a45"/>
  <rect x="248" y="238" width="1104" height="524" fill="#168c4c"/>
  <g fill="#050505">
    <circle cx="216" cy="206" r="58"/>
    <circle cx="800" cy="185" r="50"/>
    <circle cx="1384" cy="206" r="58"/>
    <circle cx="216" cy="794" r="58"/>
    <circle cx="800" cy="815" r="50"/>
    <circle cx="1384" cy="794" r="58"/>
  </g>
  <line x1="1070" y1="238" x2="1070" y2="762" stroke="#0f172a" stroke-width="5" stroke-dasharray="16 14" opacity="0.55"/>
  <text x="1070" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">Head string</text>
  <text x="1230" y="526" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#e0f2fe">Cue ball starts behind this line</text>
  <g filter="url(#shadow)">
    <circle cx="1228" cy="500" r="34" fill="#f8fafc"/>
    <circle cx="1228" cy="500" r="34" fill="url(#ballLight)"/>
    <text x="1228" y="511" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#0f172a">C</text>
  </g>
  <text x="548" y="258" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#fefce8">Diamond rack</text>
  <text x="548" y="298" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#fef9c3">1 at the apex · 9 in the center · others random</text>
  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" text-anchor="middle">
    <g transform="translate(546 500)">
      <g>
        <circle cx="112" cy="0" r="32" fill="#f4c430"/><circle cx="112" cy="0" r="32" fill="url(#ballLight)"/><text x="112" y="8" fill="#111827">1</text>
      </g>
      <g>
        <circle cx="56" cy="36" r="32" fill="#2563eb"/><circle cx="56" cy="36" r="32" fill="url(#ballLight)"/><text x="56" y="44" fill="#fff">2</text>
        <circle cx="56" cy="-36" r="32" fill="#ef4444"/><circle cx="56" cy="-36" r="32" fill="url(#ballLight)"/><text x="56" y="-28" fill="#fff">3</text>
      </g>
      <g>
        <circle cx="0" cy="72" r="32" fill="#7c3aed"/><circle cx="0" cy="72" r="32" fill="url(#ballLight)"/><text x="0" y="80" fill="#fff">4</text>
        <circle cx="0" cy="0" r="32" fill="#f5d90a"/><circle cx="0" cy="0" r="32" fill="url(#ballLight)"/><text x="0" y="8" fill="#111827">9</text>
        <circle cx="0" cy="-72" r="32" fill="#f97316"/><circle cx="0" cy="-72" r="32" fill="url(#ballLight)"/><text x="0" y="-64" fill="#111827">5</text>
      </g>
      <g>
        <circle cx="-56" cy="36" r="32" fill="#16a34a"/><circle cx="-56" cy="36" r="32" fill="url(#ballLight)"/><text x="-56" y="44" fill="#fff">6</text>
        <circle cx="-56" cy="-36" r="32" fill="#7f1d1d"/><circle cx="-56" cy="-36" r="32" fill="url(#ballLight)"/><text x="-56" y="-28" fill="#fff">7</text>
      </g>
      <g>
        <circle cx="-112" cy="0" r="32" fill="#0f172a"/><circle cx="-112" cy="0" r="32" fill="url(#ballLight)"/><text x="-112" y="8" fill="#fff">8</text>
      </g>
    </g>
  </g>
  <path d="M960 500 C855 500 770 500 692 500" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 18"/>
  <polygon points="704,482 672,500 704,518" fill="#fef3c7"/>
</svg>
