<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">9-ball foul shot diagram</title>
  <desc id="desc">9-ball foul diagram showing a cue ball hitting the wrong higher-numbered ball before the lowest numbered ball.</desc>
  <defs>
    <marker id="badArrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#fecaca"/>
    </marker>
    <marker id="goodArrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#bbf7d0"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="shine" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.13"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#111827"/>
  <rect x="115" y="115" width="1370" height="770" rx="58" fill="#51311f"/>
  <rect x="175" y="175" width="1250" height="650" rx="26" fill="#118046"/>
  <rect x="232" y="232" width="1136" height="536" fill="#15904d"/>
  <g fill="#050505">
    <circle cx="188" cy="188" r="54"/><circle cx="800" cy="171" r="46"/><circle cx="1412" cy="188" r="54"/>
    <circle cx="188" cy="812" r="54"/><circle cx="800" cy="829" r="46"/><circle cx="1412" cy="812" r="54"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle">
    <circle cx="430" cy="610" r="36" fill="#f8fafc"/><circle cx="430" cy="610" r="36" fill="url(#shine)"/><text x="430" y="619" fill="#111827">C</text>
    <circle cx="900" cy="390" r="36" fill="#f4c430"/><circle cx="900" cy="390" r="36" fill="url(#shine)"/><text x="900" y="399" fill="#111827">1</text>
    <circle cx="710" cy="520" r="36" fill="#2563eb"/><circle cx="710" cy="520" r="36" fill="url(#shine)"/><text x="710" y="529" fill="#fff">2</text>
  </g>
  <path d="M430 610 L710 520" stroke="#fecaca" stroke-width="12" stroke-linecap="round" marker-end="url(#badArrow)"/>
  <path d="M430 610 L900 390" stroke="#bbf7d0" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 16" marker-end="url(#goodArrow)"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="900">
    <rect x="245" y="235" width="520" height="118" rx="18" fill="#fee2e2"/>
    <text x="280" y="286" font-size="34" fill="#7f1d1d">Foul</text>
    <text x="280" y="325" font-size="28" fill="#991b1b">Cue ball hits the 2 first</text>
    <rect x="922" y="610" width="430" height="118" rx="18" fill="#ecfdf5"/>
    <text x="955" y="661" font-size="34" fill="#14532d">Legal contact</text>
    <text x="955" y="700" font-size="28" fill="#166534">Hit the lowest ball first</text>
  </g>
  <text x="780" y="585" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="950" fill="#fecaca">wrong</text>
  <text x="680" y="420" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="950" fill="#bbf7d0">legal</text>
</svg>
