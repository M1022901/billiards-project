<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">9-ball race scorecard</title>
  <desc id="desc">A simple 9-ball scorecard showing racks won in a race format rather than ball point values.</desc>
  <rect width="1600" height="1000" fill="#f4f1ea"/>
  <rect x="100" y="95" width="1400" height="810" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="170" y="185" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="950" fill="#0f172a">9-Ball Scoring: racks, not points</text>
  <text x="170" y="238" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="750" fill="#475569">Each legally won rack counts as one game. Ball numbers are not point values.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="170" y="300" width="1260" height="455" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="170" y="300" width="1260" height="86" rx="18" fill="#0f172a"/>
    <text x="230" y="355" font-size="28" font-weight="900" fill="#fff">Race to 5</text>
    <text x="545" y="355" font-size="28" font-weight="900" fill="#fff">Rack 1</text>
    <text x="710" y="355" font-size="28" font-weight="900" fill="#fff">Rack 2</text>
    <text x="875" y="355" font-size="28" font-weight="900" fill="#fff">Rack 3</text>
    <text x="1040" y="355" font-size="28" font-weight="900" fill="#fff">Rack 4</text>
    <text x="1205" y="355" font-size="28" font-weight="900" fill="#fff">Rack 5</text>
    <text x="1360" y="355" font-size="28" font-weight="900" fill="#fff" text-anchor="end">Total</text>
    <line x1="170" y1="386" x2="1430" y2="386" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="490" y1="300" x2="490" y2="755" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="655" y1="300" x2="655" y2="755" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="820" y1="300" x2="820" y2="755" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="985" y1="300" x2="985" y2="755" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="1150" y1="300" x2="1150" y2="755" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="1315" y1="300" x2="1315" y2="755" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="170" y1="510" x2="1430" y2="510" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="170" y1="633" x2="1430" y2="633" stroke="#cbd5e1" stroke-width="3"/>
    <text x="230" y="462" font-size="34" font-weight="900" fill="#0f172a">Player A</text>
    <text x="230" y="585" font-size="34" font-weight="900" fill="#0f172a">Player B</text>
    <text x="230" y="708" font-size="30" font-weight="850" fill="#64748b">Winner</text>
    <g font-size="42" font-weight="950" text-anchor="middle">
      <text x="572" y="462" fill="#16a34a">✓</text>
      <text x="737" y="462" fill="#94a3b8">–</text>
      <text x="902" y="462" fill="#16a34a">✓</text>
      <text x="1067" y="462" fill="#16a34a">✓</text>
      <text x="1232" y="462" fill="#94a3b8">–</text>
      <text x="1372" y="462" fill="#0f172a">3</text>
      <text x="572" y="585" fill="#94a3b8">–</text>
      <text x="737" y="585" fill="#16a34a">✓</text>
      <text x="902" y="585" fill="#94a3b8">–</text>
      <text x="1067" y="585" fill="#94a3b8">–</text>
      <text x="1232" y="585" fill="#16a34a">✓</text>
      <text x="1372" y="585" fill="#0f172a">2</text>
      <text x="572" y="708" fill="#0f766e">A</text>
      <text x="737" y="708" fill="#0f766e">B</text>
      <text x="902" y="708" fill="#0f766e">A</text>
      <text x="1067" y="708" fill="#0f766e">A</text>
      <text x="1232" y="708" fill="#0f766e">B</text>
    </g>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="900">
    <rect x="170" y="800" width="1260" height="58" rx="29" fill="#ecfeff"/>
    <text x="210" y="838" font-size="25" fill="#0f766e">In 9-ball, legally pocketing the 9 wins the rack. The match score counts racks won.</text>
  </g>
</svg>
