<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">9-ball strategy shot diagram</title>
  <desc id="desc">Overhead 9-ball strategy diagram showing lowest-ball first contact, a combination route into the 9-ball, and cue-ball position planning.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#fef3c7"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="shine" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.13"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#111827"/>
  <rect x="115" y="115" width="1370" height="770" rx="58" fill="#51311f"/>
  <rect x="175" y="175" width="1250" height="650" rx="26" fill="#118046"/>
  <rect x="232" y="232" width="1136" height="536" fill="#15904d"/>
  <g fill="#050505">
    <circle cx="188" cy="188" r="54"/><circle cx="800" cy="171" r="46"/><circle cx="1412" cy="188" r="54"/>
    <circle cx="188" cy="812" r="54"/><circle cx="800" cy="829" r="46"/><circle cx="1412" cy="812" r="54"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle">
    <circle cx="430" cy="625" r="34" fill="#f8fafc"/><circle cx="430" cy="625" r="34" fill="url(#shine)"/><text x="430" y="634" fill="#111827">C</text>
    <circle cx="675" cy="520" r="34" fill="#f4c430"/><circle cx="675" cy="520" r="34" fill="url(#shine)"/><text x="675" y="529" fill="#111827">1</text>
    <circle cx="895" cy="440" r="34" fill="#f5d90a"/><circle cx="895" cy="440" r="34" fill="url(#shine)"/><text x="895" y="449" fill="#111827">9</text>
    <circle cx="1085" cy="345" r="34" fill="#2563eb"/><circle cx="1085" cy="345" r="34" fill="url(#shine)"/><text x="1085" y="354" fill="#fff">2</text>
  </g>
  <path d="M430 625 L675 520 L895 440 L1376 200" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M675 520 C705 610 770 676 890 714" fill="none" stroke="#bfdbfe" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 14" marker-end="url(#arrow)"/>
  <rect x="775" y="670" width="230" height="90" rx="45" fill="#0f766e" opacity="0.9"/>
  <text x="890" y="705" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ecfeff">position zone</text>
  <text x="890" y="735" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ccfbf1">leave angle for the 2</text>
  <text x="256" y="220" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="900" fill="#f8fafc">Legal strategy</text>
  <text x="256" y="264" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#dbeafe">Cue ball must hit the 1 first. The 1 can send the 9 toward a pocket.</text>
  <g font-family="Inter, Arial, sans-serif" font-weight="900">
    <rect x="1120" y="620" width="245" height="92" rx="14" fill="#f8fafc" opacity="0.94"/>
    <text x="1145" y="656" font-size="22" fill="#0f172a">Plan choices</text>
    <text x="1145" y="686" font-size="17" fill="#475569">Attack · safety · position</text>
  </g>
</svg>
