<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f4f1ea"/><rect x="105" y="95" width="1390" height="810" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="175" y="185" font-family="Inter,Arial" font-size="54" font-weight="950" fill="#0f172a">Snooker scoring</text>
  <text x="175" y="238" font-family="Inter,Arial" font-size="28" font-weight="750" fill="#475569">Reds score 1. Colours score 2 through 7. Fouls add points to the opponent.</text>
  <g font-family="Inter,Arial" font-size="25" font-weight="900" text-anchor="middle">
    <circle cx="260" cy="420" r="44" fill="#ef4444"/><text x="260" y="430" fill="#fff">1</text><circle cx="405" cy="420" r="44" fill="#facc15"/><text x="405" y="430">2</text><circle cx="550" cy="420" r="44" fill="#16a34a"/><text x="550" y="430" fill="#fff">3</text><circle cx="695" cy="420" r="44" fill="#92400e"/><text x="695" y="430" fill="#fff">4</text><circle cx="840" cy="420" r="44" fill="#2563eb"/><text x="840" y="430" fill="#fff">5</text><circle cx="985" cy="420" r="44" fill="#ec4899"/><text x="985" y="430" fill="#fff">6</text><circle cx="1130" cy="420" r="44" fill="#050505"/><text x="1130" y="430" fill="#fff">7</text>
  </g>
  <rect x="230" y="590" width="1120" height="170" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="280" y="652" font-family="Inter,Arial" font-size="32" font-weight="900" fill="#0f172a">Example break</text><text x="280" y="702" font-family="Inter,Arial" font-size="28" font-weight="750" fill="#475569">Red + black repeated: 1 + 7, 1 + 7, 1 + 7 ...</text>
</svg>
