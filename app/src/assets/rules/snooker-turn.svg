<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#111827"/><rect x="150" y="110" width="1300" height="780" rx="58" fill="#51311f"/><rect x="210" y="170" width="1180" height="660" rx="28" fill="#168c4c"/>
  <text x="245" y="250" font-family="Inter,Arial" font-size="46" font-weight="900" fill="#fff">Your turn: red, then colour</text>
  <text x="245" y="300" font-family="Inter,Arial" font-size="26" font-weight="700" fill="#dcfce7">When reds remain, pot a red first; after a red, nominate and pot a colour.</text>
  <g font-family="Inter,Arial" font-size="24" font-weight="900" text-anchor="middle"><circle cx="420" cy="625" r="34" fill="#f8fafc"/><text x="420" y="634">C</text><circle cx="695" cy="535" r="34" fill="#ef4444"/><text x="695" y="544" fill="#fff">1</text><circle cx="965" cy="430" r="34" fill="#050505"/><text x="965" y="439" fill="#fff">7</text></g>
  <path d="M420 625 L695 535" stroke="#fef3c7" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M695 535 C785 500 850 470 965 430" stroke="#bfdbfe" stroke-width="7" stroke-dasharray="16 14" fill="none"/>
  <rect x="1040" y="610" width="270" height="110" rx="16" fill="#f8fafc"/><text x="1070" y="655" font-family="Inter,Arial" font-size="28" font-weight="900" fill="#0f172a">Next choice</text><text x="1070" y="690" font-family="Inter,Arial" font-size="21" font-weight="700" fill="#475569">Black returns to spot.</text>
</svg>
